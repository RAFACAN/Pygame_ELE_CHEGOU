[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silencio-domestico"
version = "0.1.0"
description = "Jogo em pygame sobre violência doméstica."
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5,<3.0",
]

[project.scripts]
silencio-domestico = "game:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["game", "entities", "settings"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
